version: "3.7"

services:
  ranger-postgres:
    image: postgres:16
    platform: linux/amd64
    hostname: ranger-postgres
    container_name: ranger-postgres
    environment:
      POSTGRES_DB: ranger
      POSTGRES_USER: ranger
      POSTGRES_PASSWORD: ranger_password
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - ./data/ranger-db:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
      - "5433:5432"
    networks:
      - dldg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranger"]
      interval: 10s
      timeout: 5s
      retries: 5

  ranger-admin:
    image: apache/ranger:2.5.0
    platform: linux/amd64
    hostname: ranger-admin
    container_name: ranger-admin
    depends_on:
      ranger-postgres:
        condition: service_healthy
    environment:
      - RANGER_DB_HOST=ranger-postgres
      - RANGER_DB_NAME=ranger
      - RANGER_DB_USER=ranger
      - RANGER_DB_PASSWORD=ranger_password
      - RANGER_ADMIN_PASSWORD=admin
      - RANGER_USERSYNC_ENABLED=false
    volumes:
      - ./conf/ranger:/etc/ranger
      - ./data/ranger-admin:/var/log/ranger
    expose:
      - 6080
      - 6182
    ports:
      - "6080:6080"
      - "6182:6182"
    networks:
      - dldg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/login.jsp"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  solr:
    image: solr:9.7
    platform: linux/amd64
    hostname: solr
    container_name: solr
    command: ["solr-precreate", "ranger_audits"]
    environment:
      - SOLR_OPTS=-Xms512m -Xmx1g
    volumes:
      - ./data/solr:/var/solr
    expose:
      - 8983
    ports:
      - "8983:8983"
    networks:
      - dldg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/cores?action=STATUS"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dldg:
    name: dldg
    external: true

