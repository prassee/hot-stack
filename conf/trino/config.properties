# Coordinator configuration
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Query processing configuration
query.max-memory=4GB
query.max-memory-per-node=2GB
query.max-stage-count=100
query.max-history=100
query.min-expire-age=30m

# Node scheduler configuration
node-scheduler.max-splits-per-node=200
node-scheduler.min-pending-splits-per-task=16

# Task configuration
task.max-worker-threads=200
task.min-drivers=200

# Memory management
memory.heap-headroom-per-node=1GB

# Exchange configuration
exchange.client-threads=25
exchange.max-buffer-size=32MB
exchange.max-response-size=16MB

# Spill configuration
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
spiller-threads=4

# Optimizer configuration
optimizer.join-reordering-strategy=AUTOMATIC
optimizer.max-reordered-joins=9

# Security configuration
http-server.https.enabled=false

# Authentication
http-server.authentication.type=PASSWORD
internal-communication.shared-secret=hot-stack-secret-change-in-production

# Access Control (RBAC)
access-control.config-files=etc/access-control.properties

# Web UI configuration
web-ui.enabled=true

# Graceful shutdown
shutdown.grace-period=2m
