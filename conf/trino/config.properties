# Coordinator configuration
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Query processing configuration
query.max-memory=4GB
query.max-memory-per-node=2GB
query.max-stage-count=100
query.max-history=100
query.min-expire-age=30m

# Node scheduler configuration
node-scheduler.max-splits-per-node=200
node-scheduler.min-pending-splits-per-task=16

# Task configuration
task.max-worker-threads=200
task.min-drivers=200

# Memory management
memory.heap-headroom-per-node=1GB

# Exchange configuration
exchange.client-threads=25
exchange.max-buffer-size=32MB
exchange.max-response-size=16MB

# Spill configuration
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
spiller-threads=4

# Optimizer configuration
optimizer.join-reordering-strategy=AUTOMATIC
optimizer.max-reordered-joins=9

# Security configuration
http-server.authentication.type=password
http-server.https.enabled=false
password-authenticator.config-files=/etc/trino/password-authenticator.properties

# Web UI configuration
web-ui.enabled=true

# Graceful shutdown
shutdown.grace-period=2m

# Removed invalid/unused properties that caused startup errors:
#   - system.access-control.name (invalid key)
#   - access-control.name (was unused; maybe plugin not installed)
#
# If you have installed an access-control plugin, enable it like this:
# access-control.name=<plugin-id>                # e.g. opa or another plugin id (only if plugin exists under /etc/trino/plugin)
# access-control.config-files=access-control.properties   # only if the plugin requires a config file
#
# Otherwise leave access-control settings out so Trino starts without them.

# Access-control plugin: enable only if a plugin JAR is installed under /etc/trino/plugin/<plugin-id>
# To enable a plugin, set:
# access-control.name=<plugin-id>
# access-control.config-files=<comma-separated-config-files>
# (Left blank/disabled by default to avoid startup errors when no plugin is installed)
