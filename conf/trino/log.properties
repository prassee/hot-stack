# Root logger level
io.trino=INFO

# Coordinator and worker logging
io.trino.server.PluginManager=INFO
io.trino.metadata.MetadataManager=INFO
io.trino.sql.planner=INFO
io.trino.cost=INFO
io.trino.execution=INFO
io.trino.operator=INFO

# Query execution and planning
io.trino.sql.analyzer=INFO
io.trino.sql.planner.plan=INFO
io.trino.sql.planner.optimizations=INFO
io.trino.execution.scheduler=INFO
io.trino.execution.SqlQueryExecution=INFO

# Memory and resource management
io.trino.memory=INFO
io.trino.execution.resourcegroups=INFO
io.trino.execution.QueryManager=INFO

# Connector specific logging
io.trino.plugin.hive=INFO
io.trino.plugin.hive.metastore=INFO
io.trino.plugin.hive.s3=DEBUG
io.trino.plugin.hive.util=INFO
io.trino.plugin.memory=WARN

# Security and authentication
io.trino.security=INFO
io.trino.server.security=INFO

# Event listeners and monitoring
io.trino.eventlistener=INFO
io.trino.execution.QueryMonitor=INFO

# Exchange and communication
io.trino.server.remotetask=INFO
io.trino.execution.buffer=INFO
io.trino.operator.exchange=INFO

# Spill and storage
io.trino.spiller=INFO
io.trino.operator.aggregation=INFO

# Web UI and HTTP
io.trino.server.ui=INFO
io.trino.server.protocol=INFO

# Silence noisy third-party loggers
org.apache.hadoop=WARN
org.apache.hadoop.fs.s3a=INFO
com.amazonaws=WARN
org.apache.http=WARN
org.eclipse.jetty=WARN
org.apache.thrift=WARN
com.facebook.airlift=WARN
io.airlift=WARN

# JVM and system logging
sun.rmi=WARN
javax.management=WARN

# Garbage collection logging (if enabled via JVM flags)
# These will only appear if -XX:+PrintGC or similar flags are set
gc=INFO

# Discovery service
io.trino.discovery=INFO
io.trino.server.ServerMainModule=INFO

# Plugin loading and management
io.trino.spi=INFO
io.trino.connector=INFO

# Backup and recovery
io.trino.backup=INFO

# Performance and statistics
io.trino.cost.StatsCalculator=INFO
io.trino.sql.planner.iterative=INFO

# Async and threading
java.util.concurrent=WARN
io.trino.util.concurrent=INFO

# File system operations (for debugging S3/MinIO issues)
org.apache.hadoop.fs=INFO
org.apache.hadoop.fs.s3a.S3AFileSystem=INFO
org.apache.hadoop.fs.s3a.auth=INFO
org.apache.hadoop.security=WARN

# Custom application logging levels
# Add your custom loggers here as needed
