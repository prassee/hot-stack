version: "3.7"

services:
  mysql:
    image: mysql:8.0.34
    platform: linux/amd64
    hostname: mysql
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password --lower_case_table_names=2
    # restart: never
    volumes:
      - ./data/mysqldir:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=default
      - MYSQL_USER=dataeng
      - MYSQL_PASSWORD=dataengineering_user
      - MYSQL_ROOT_PASSWORD=dataengineering
    healthcheck:
      interval: 5s
      retries: 5
    expose:
      - 3306
    ports:
      - 3306:3306
    networks:
      - dldg

  minio:
    image: minio/minio:latest
    platform: linux/amd64
    hostname: minio
    container_name: minio
    volumes:
      - ${PWD}/data/minio/:/opt/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_admin
    command: ["minio", "server", "--console-address", ":9001", "/opt/data"]
    expose:
      - 9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
      - target: 9001
        published: 9001
        protocol: tcp
        mode: host
    networks:
      - dldg

  metastore:
    image: apache/hive:3.1.3
    platform: linux/amd64
    hostname: metastore
    container_name: metastore
    volumes:
      - ./data/jars/hadoop-aws-3.2.0.jar:/opt/hive/lib/hadoop-aws-3.2.0.jar
      - ./data/jars/mysql-connector-java-8.0.23.jar:/opt/hive/lib/mysql-connector-java-8.0.23.jar
      - ./data/jars/aws-java-sdk-bundle-1.11.375.jar:/opt/hive/lib/aws-java-sdk-bundle-1.11.375.jar
      - ./conf:/opt/hive/conf
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=mysql
      - IS_RESUME="true"
    expose:
      - 9083
    ports:
      - target: 9083
        published: 9083
        protocol: tcp
        mode: host
    networks:
      - dldg


  trino:
    image: trinodb/trino:476
    platform: linux/amd64
    hostname: trino
    container_name: trino
    volumes:
      - ./conf/trino/certs:/etc/trino/certs
      - ./conf/trino:/etc/trino
    environment:
      - TRINO_ENVIRONMENT=production
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio_admin
      - AWS_REGION=us-east-1
    expose:
      - 8080
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
      - target: 8443
        published: 8443
        protocol: tcp
        mode: host
    # depends_on:
    #   - metastore
    #   - minio
    networks:
      - dldg

  opa:
    image: openpolicyagent/opa:latest-debug
    platform: linux/amd64
    hostname: opa
    container_name: opa
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr"
      - "0.0.0.0:8181"
      - "--set=decision_logs.console=true"
      - "/policies"
    volumes:
      - ./policies:/policies
    networks:
      - dldg

  spark-master:
    image: apache/spark:3.5.5-scala2.12-java17-python3-ubuntu
    hostname: spark-master
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./pyspark:/opt/spark/app
      - ./data/jars:/opt/spark/extrajars
    ports:
      - "8083:8080"
      - "7077:7077"
      - "4040:4040"
    networks:
      - dldg

  spark-worker-1:
    image: apache/spark:3.5.5-scala2.12-java17-python3-ubuntu
    hostname: spark-worker-1
    container_name: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./pyspark:/opt/spark/app
      - ./data/jars:/opt/spark/extrajars
    ports:
      - "8084:8081"
    networks:
      - dldg

networks:
  dldg:
    name: dldg
